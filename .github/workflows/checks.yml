name: foundation-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fail before dependency installation if the reviewed free/manual Render Blueprint drifts.
      - run: python scripts/check_render_release_policy.py
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && PYTHONPATH=. pytest -q
      - run: cd backend && DATABASE_URL=sqlite:////tmp/migration.db alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python scripts/smoke_compose.py

  free-cloud-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python scripts/smoke_compose.py --combined
  postgres-risk-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TSL_PG_RISK_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/trading_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && PYTHONPATH=. pytest -q tests/test_paper_daily_loss_postgres.py

  postgres-reservations-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_trading_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_trading_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAPER_RISK_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/test_trading_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && PYTHONPATH=. pytest -q tests/test_paper_risk_reservations_postgres.py
