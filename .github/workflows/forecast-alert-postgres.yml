name: forecast-alert-postgres-acceptance

on:
  pull_request:
    paths:
      - 'backend/app/forecast_alert_outbox.py'
      - 'backend/app/forecast_event_store.py'
      - 'backend/tests/test_forecast_alert_outbox_postgres.py'
      - 'backend/tests/test_forecast_event_store_cross_engine.py'
      - '.github/workflows/forecast-alert-postgres.yml'
  push:
    branches:
      - 'loop5/forecast-review-outbox-20261024'
    paths:
      - 'backend/app/forecast_alert_outbox.py'
      - 'backend/app/forecast_event_store.py'
      - 'backend/tests/test_forecast_alert_outbox_postgres.py'
      - 'backend/tests/test_forecast_event_store_cross_engine.py'
      - '.github/workflows/forecast-alert-postgres.yml'

permissions:
  contents: read

jobs:
  postgres-forecast-alert-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tsl_test
          POSTGRES_PASSWORD: tsl_test
          POSTGRES_DB: test_forecast_alerts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsl_test -d test_forecast_alerts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORECAST_ALERT_TEST_DATABASE_URL: postgresql+psycopg://tsl_test:tsl_test@127.0.0.1:5432/test_forecast_alerts
      FORECAST_JOURNAL_TEST_DATABASE_URL: postgresql+psycopg://tsl_test:tsl_test@127.0.0.1:5432/test_forecast_alerts
      DATABASE_URL: sqlite:////tmp/tsl_forecast_acceptance_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: PostgreSQL forecast outbox and journal concurrency acceptance
        run: cd backend && PYTHONPATH=. python -m pytest -q -rs tests/test_forecast_alert_outbox_postgres.py tests/test_forecast_event_store_cross_engine.py
