name: quote-replay-postgres-acceptance

on:
  pull_request:
    paths:
      - 'backend/app/paper_quote_replay_store.py'
      - 'backend/app/paper_quote_journal_atomic.py'
      - 'backend/app/paper_journal_store.py'
      - 'backend/tests/test_paper_quote_replay_postgres.py'
      - 'backend/tests/test_paper_quote_journal_atomic.py'
      - '.github/workflows/quote-replay-postgres.yml'
  push:
    branches:
      - 'risk/durable-paper-quote-replay-20261025'
    paths:
      - 'backend/app/paper_quote_replay_store.py'
      - 'backend/app/paper_quote_journal_atomic.py'
      - 'backend/app/paper_journal_store.py'
      - 'backend/tests/test_paper_quote_replay_postgres.py'
      - 'backend/tests/test_paper_quote_journal_atomic.py'
      - '.github/workflows/quote-replay-postgres.yml'

permissions:
  contents: read

jobs:
  postgres-quote-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tsl_test
          POSTGRES_PASSWORD: tsl_test
          POSTGRES_DB: tsl_quote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tsl_test -d tsl_quote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TSL_PG_QUOTE_TEST_URL: postgresql+psycopg://tsl_test:tsl_test@127.0.0.1:5432/tsl_quote_test
      DATABASE_URL: sqlite:////tmp/tsl_quote_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: PostgreSQL quote replay and atomic journal acceptance
        run: cd backend && PYTHONPATH=. python -m pytest -q tests/test_paper_quote_replay_postgres.py
